---
- name: Prepare web servers
  hosts: webservers
  become: true
  gather_facts: false
  tags: setup

  vars:
    docker_users:
      - "{{ ansible_user }}"

  pre_tasks:
    - name: Wait until the server accepts SSH connections
      ansible.builtin.wait_for_connection:
        timeout: 300

    - name: Gather facts
      ansible.builtin.setup:

    - name: Wait until cloud-init has finished
      ansible.builtin.command: cloud-init status --wait
      changed_when: false

    - name: Update the apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

  roles:
    - geerlingguy.docker

  post_tasks:
    - name: Install the Docker SDK for Python
      ansible.builtin.apt:
        name: python3-docker
        state: present

- name: Deploy the application
  hosts: webservers
  become: true
  serial: 1
  tags: deploy

  vars_files:
    - vault.yml

  roles:
    - app

- name: Set up monitoring
  hosts: webservers
  become: true
  tags: monitoring

  vars_files:
    - vault.yml

  vars:
    datadog_key: "{{ datadog_api_key | default('') }}"

  pre_tasks:
    - name: Ensure the Datadog API key looks like a key
      ansible.builtin.assert:
        that:
          - datadog_key | length == 32
        fail_msg: >-
          The Datadog API key is malformed. Fix the vault key datadog_api_key
          with "make vault-edit" — a Datadog API key is 32 characters long —
          or clear it to skip the agent altogether.
        quiet: true
      when: datadog_key | length > 0

    - name: Report that the Datadog agent is skipped
      ansible.builtin.debug:
        msg: >-
          The vault key datadog_api_key is empty, so the Datadog agent is not
          installed. The uptime reporting is set up as usual.
      when: datadog_key | length == 0

  roles:
    - role: datadog.dd.agent
      when: datadog_key | length == 32
    - uptime
