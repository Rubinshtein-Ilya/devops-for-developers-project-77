---
- name: Prepare web servers
  hosts: webservers
  become: true
  gather_facts: false
  tags: setup

  vars:
    docker_users:
      - "{{ ansible_user }}"

  pre_tasks:
    - name: Wait until the server accepts SSH connections
      ansible.builtin.wait_for_connection:
        timeout: 300

    - name: Gather facts
      ansible.builtin.setup:

    - name: Wait until cloud-init has finished
      ansible.builtin.command: cloud-init status --wait
      changed_when: false

    - name: Update the apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

  roles:
    - geerlingguy.docker

  post_tasks:
    - name: Install the Docker SDK for Python
      ansible.builtin.apt:
        name: python3-docker
        state: present

- name: Deploy the application
  hosts: webservers
  become: true
  serial: 1
  tags: deploy

  roles:
    - app

- name: Set up monitoring
  hosts: webservers
  become: true
  tags: monitoring

  pre_tasks:
    - name: Ensure the Datadog API key is set
      ansible.builtin.assert:
        that:
          - datadog_api_key | length == 32
        fail_msg: >-
          TF_VAR_datadog_api_key is missing or malformed. Add it to the vault
          (make vault-edit) and reload with ./scripts/secrets.sh — a Datadog
          API key is 32 characters long.
        quiet: true

  roles:
    - datadog.dd.agent
    - uptime
